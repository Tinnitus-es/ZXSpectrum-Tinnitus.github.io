<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invocación</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background-size: cover;
    background-color:black;
    background-position: center center;
    font-family: Arial, sans-serif;
    color: black;
    text-align: center;
    transition: filter 1s ease;
  }

  .container {
    margin-top: 20%;
    z-index: 5;
    position: relative;
  }

  #videoFull {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    background: black;
    z-index: 9999;
  }

  #blackCover {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    z-index: 10000;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  /* Cámara */
  #camara {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 9998;
  }

  /* Overlay sangre */
  #sangre {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
    z-index: 99999;
  }

  /* Distorsión tipo scanline */
  .distorsion {
    position: relative;
  }

  .distorsion::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    animation: scan 1s linear infinite;
  }

  @keyframes scan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  .blur {
    filter: blur(4px) brightness(0.7);
  }

</style>
</head>

<body>

<div id="blackCover"></div>

<div class="container">
  <input type="text" id="clave" placeholder="Palabra clave">
  <button onclick="verificar()">Invocar</button>
</div>

<!-- VIDEO -->
<video id="videoFull" src="Invocacion.mp4" playsinline webkit-playsinline></video>

<!-- CÁMARA -->
<video id="camara" autoplay playsinline></video>

<!-- OVERLAY SANGRE -->
<img id="sangre" src="sangre.gif">

<script>
let bloqueando = true;

// ELEMENTOS
const video = document.getElementById("videoFull");
const cover = document.getElementById("blackCover");
const camara = document.getElementById("camara");
const sangre = document.getElementById("sangre");

// AUDIOS
const audioVideo = new Audio("Susurros.mp3");
const audioCamara = new Audio("Susurros.mp3");

// CLAVES CODIFICADAS
const claveVideo  = atob("QXJzIEdvZXRpYQ==").toUpperCase();        
const claveCamara = atob("U3BlY3VsdW0gVml0YWU=").toUpperCase();    

// VERIFICACIÓN
async function verificar() {
  const entrada = document.getElementById('clave').value.trim().toUpperCase();

  // ACTIVAR VIDEO
  if (entrada === claveVideo) {
    activarVideo();
    return;
  }

  // ACTIVAR CÁMARA
  if (entrada === claveCamara) {
    activarCamara();
    return;
  }

  alert("Palabra incorrecta.");
}

/* ============================
      ACTIVAR VIDEO
============================ */
function activarVideo() {
  audioVideo.play().catch(()=>{});
  video.style.display = "block";

  if (video.requestFullscreen) {
    video.requestFullscreen();
  }

  video.play();
  video.onended = finalizarVideo;
}

/* CONTROL DE SALIDA DE FULLSCREEN */
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && bloqueando) {

    cover.style.opacity = "1";
    video.style.visibility = "hidden";

    setTimeout(() => {
      if (video.requestFullscreen) {
        video.requestFullscreen();
      }

      video.style.visibility = "visible";
      video.play();

      setTimeout(() => {
        cover.style.opacity = "0";
      }, 100);

    }, 30);
  }
});

/* FINALIZAR VIDEO */
function finalizarVideo() {
  bloqueando = false;

  cover.style.opacity = "1";

  setTimeout(() => {
    document.exitFullscreen?.();

    document.body.innerHTML = "";
    document.body.style.background = "black";

  }, 1000);
}

/* ============================
      ACTIVAR CÁMARA
============================ */
async function activarCamara() {
  try {
    audioCamara.play().catch(()=>{});

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    camara.srcObject = stream;
    camara.style.display = "block";

    sangre.style.display = "block";

  } catch (err) {
    alert("No se pudo acceder a la cámara.");
    console.error(err);
  }
}
</script>

</body>
</html>
